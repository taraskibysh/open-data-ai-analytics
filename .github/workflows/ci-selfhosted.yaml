name: CI (Self-Hosted Runner)

on:
  workflow_dispatch:

jobs:
  run-local-visualization:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert ipykernel requests 
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare Data (Local Run)
        run: |
          python src/data_loader.py

      - name: Run Data Research (Local Run)
        run: |
          jupyter nbconvert --to notebook --execute --inplace notebooks/data_research.ipynb

      - name: Run Visualization (Local Run)
        run: |
          mkdir -p artifacts/visualization
          jupyter nbconvert --to html --execute notebooks/visualization.ipynb --output-dir artifacts/visualization/

      - name: Upload local artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selfhosted-visualization-result
          path: artifacts/visualization/*.html