name: Python CI Modules & Pages Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      module:
        description: "Select a module to run (or 'all')"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - data_loader
          - data_research
          - visualization
          - tests

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  run-modules:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        module: [data_loader, data_research, visualization, tests]

    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.module == 'all' || github.event.inputs.module == matrix.module }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jupyter nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run module & Generate artifacts
        run: |
          mkdir -p artifacts/${{ matrix.module }}
          echo "Running module: ${{ matrix.module }}"

          if [ "${{ matrix.module }}" == "data_loader" ]; then
            python src/data_loader.py > artifacts/${{ matrix.module }}/execution.log 2>&1
            
          elif [ "${{ matrix.module }}" == "tests" ]; then
            pytest tests/ > artifacts/${{ matrix.module }}/pytest_report.log 2>&1
            
          elif [ "${{ matrix.module }}" == "data_research" ]; then
            jupyter nbconvert --to html --execute notebooks/data_research.ipynb --output-dir artifacts/${{ matrix.module }}/
            
          elif [ "${{ matrix.module }}" == "visualization" ]; then
            jupyter nbconvert --to html --execute notebooks/visualization.ipynb --output-dir artifacts/${{ matrix.module }}/
          fi

      - name: Upload module artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.module }}
          path: artifacts/${{ matrix.module }}

  deploy-pages:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: run-modules
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download visualization artifacts
        uses: actions/download-artifact@v4
        with:
          name: result-visualization
          path: public/

      - name: Prepare HTML for Pages
        run: |
          if [ -f public/visualization.html ]; then
            mv public/visualization.html public/index.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4